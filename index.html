<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Life Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>

    <!-- Global storage-error banner (shared by taskList.js and quickLinks.js) -->
    <div
      id="storage-error-banner"
      role="alert"
      aria-live="assertive"
      class="storage-error-banner hidden"
    >
      <p id="storage-error-message">
        Your data could not be saved. Changes may be lost if you close this tab.
      </p>
      <button
        id="storage-error-dismiss"
        type="button"
        aria-label="Dismiss storage error message"
      >
        &times;
      </button>
    </div>

    <main class="dashboard">

      <!-- ===================== GREETING WIDGET ===================== -->
      <section id="greeting-widget" class="widget" aria-labelledby="greeting-text">
        <h1 id="greeting-text" class="greeting-text"></h1>
        <p
          id="time-display"
          class="time-display"
          aria-live="polite"
          aria-atomic="true"
          aria-label="Current time: --:--"
        >--:--</p>
        <p
          id="date-display"
          class="date-display"
          aria-live="polite"
          aria-atomic="true"
          aria-label="Current date"
        ></p>

        <!-- Name editor -->
        <div class="greeting-name-row">
          <span id="greeting-name-display" class="greeting-name-display" aria-label="Your name"></span>
          <button
            id="greeting-name-edit-btn"
            type="button"
            class="greeting-name-edit-btn"
            aria-label="Edit your name"
          >✎ Edit name</button>
        </div>
        <form id="greeting-name-form" class="greeting-name-form hidden" novalidate>
          <label for="greeting-name-input" class="visually-hidden">Your name</label>
          <input
            type="text"
            id="greeting-name-input"
            name="greeting-name"
            placeholder="Enter your name"
            maxlength="50"
            autocomplete="given-name"
          />
          <button type="submit" aria-label="Save name">Save</button>
        </form>
      </section>

      <!-- ===================== FOCUS TIMER ===================== -->
      <section id="focus-timer" class="widget" aria-labelledby="focus-timer-heading">
        <h2 id="focus-timer-heading" class="widget-title">Focus Timer</h2>

        <p
          id="timer-display"
          class="timer-display"
          role="timer"
          aria-live="off"
          aria-label="Time remaining: 25 minutes 0 seconds"
          aria-atomic="true"
        >25:00</p>

        <div class="timer-duration-row">
          <label for="timer-duration-input" class="timer-duration-label">Duration (min)</label>
          <input
            type="number"
            id="timer-duration-input"
            name="timer-duration"
            class="timer-duration-input"
            value="25"
            min="1"
            max="99"
            aria-label="Set timer duration in minutes"
          />
        </div>

        <div class="timer-controls" role="group" aria-label="Timer controls">
          <button id="timer-start" type="button" aria-label="Start timer">Start</button>
          <button id="timer-stop"  type="button" aria-label="Stop timer">Stop</button>
          <button id="timer-reset" type="button" aria-label="Reset timer to 25 minutes">Reset</button>
        </div>

        <p
          id="timer-end-message"
          class="timer-end-message hidden"
          role="status"
          aria-live="assertive"
          aria-atomic="true"
        >
          Session complete! Great work — take a break.
        </p>
      </section>

      <!-- ===================== TASK LIST ===================== -->
      <section id="task-list" class="widget" aria-labelledby="task-list-heading">
        <h2 id="task-list-heading" class="widget-title">Tasks</h2>

        <form id="task-add-form" novalidate>
          <label for="task-input">New task</label>
          <div class="input-row">
            <input
              type="text"
              id="task-input"
              name="task-input"
              placeholder="What needs to be done?"
              maxlength="255"
              autocomplete="off"
              aria-describedby="task-input-error"
            />
            <button type="submit" id="task-add-btn">Add</button>
          </div>
          <p
            id="task-input-error"
            class="validation-error hidden"
            aria-live="assertive"
            role="alert"
          ></p>
        </form>

        <!-- Sort controls -->
        <div class="task-sort-row">
          <label for="task-sort-select" class="task-sort-label">Sort by</label>
          <select id="task-sort-select" class="task-sort-select" aria-label="Sort tasks">
            <option value="date-asc">Date added ↑</option>
            <option value="date-desc">Date added ↓</option>
            <option value="alpha-asc">A → Z</option>
            <option value="alpha-desc">Z → A</option>
            <option value="status">Pending first</option>
          </select>
        </div>

        <ul id="task-items" class="task-items" aria-label="Task items" aria-live="polite" aria-relevant="additions removals"></ul>
      </section>

      <!-- ===================== QUICK LINKS ===================== -->
      <section id="quick-links" class="widget" aria-labelledby="quick-links-heading">
        <h2 id="quick-links-heading" class="widget-title">Quick Links</h2>

        <form id="link-add-form" novalidate>
          <div class="form-field">
            <label for="link-label-input">Label</label>
            <input
              type="text"
              id="link-label-input"
              name="link-label"
              placeholder="e.g. GitHub"
              maxlength="205"
              autocomplete="off"
              aria-describedby="link-label-error"
            />
            <p
              id="link-label-error"
              class="validation-error hidden"
              aria-live="assertive"
              role="alert"
            ></p>
          </div>

          <div class="form-field">
            <label for="link-url-input">URL</label>
            <input
              type="url"
              id="link-url-input"
              name="link-url"
              placeholder="https://example.com"
              maxlength="2053"
              autocomplete="off"
              aria-describedby="link-url-error"
            />
            <p
              id="link-url-error"
              class="validation-error hidden"
              aria-live="assertive"
              role="alert"
            ></p>
          </div>

          <button type="submit" id="link-add-btn">Add Link</button>
        </form>

        <div id="link-items" class="link-items" role="list" aria-label="Saved links"></div>
      </section>

    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
